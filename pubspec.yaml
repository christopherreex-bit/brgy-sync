publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.2
  file_picker: ^8.3.7
  uuid: ^4.5.1
  fl_chart: ^0.70.2
  dropdown_search: ^6.0.2
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
