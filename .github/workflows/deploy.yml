name: Deploy Flutter Web to Heroku

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release \
          --dart-define=TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }} \
          --dart-define=TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }} \
          --dart-define=TWILIO_FROM=${{ secrets.TWILIO_FROM }}

      - name: Copy Heroku server files into build output
        run: |
          cp heroku-server/server.js build/web/server.js
          cp heroku-server/package.json build/web/package.json
          cp heroku-server/Procfile build/web/Procfile

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: "build/web"
