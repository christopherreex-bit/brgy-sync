name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }} --dart-define=TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }} --dart-define=TWILIO_FROM=${{ secrets.TWILIO_FROM }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=brgy-sync --commit-dirty=true
